<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — MAVITAS Collector</title>
  <meta name="description" content="Register your MAVITAS collector account.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <main style="min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;">
    <div class="form-box-editorial" style="width: min(440px, 100%); text-align: center;">
      <a class="logo" href="index.html" style="justify-content: center; margin-bottom: 32px; display: inline-block;">
        <img src="assets/images/logo.png" alt="MAVITAS Logo">
      </a>

      <span class="eyebrow" style="margin-bottom: 8px;">PRIVATE COLLECTOR ARCHIVE</span>
      <h1 style="font-size: 48px; margin-bottom: 16px;">Join.</h1>
      <p style="color: var(--text-secondary); font-size: 13px; line-height: 1.7; margin-bottom: 28px;">
        Registration is visual only in this release. All acquisitions work without registering.
      </p>

      <form data-demo style="text-align: left;">
        <div class="field">
          <label>Full Name</label>
          <input type="text" required placeholder="Julian Vance">
        </div>

        <div class="field">
          <label>Email Address</label>
          <input type="email" required placeholder="you@example.com">
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" required placeholder="••••••••">
        </div>

        <button class="btn primary wide" style="width: 100%; margin-top: 12px;">Create Collector Profile →</button>
      </form>

      <div
        style="margin-top: 24px; font-size: 11px; color: var(--text-secondary); font-family: var(--font-label); letter-spacing: 0.08em;">
        Already registered? <a href="login.html" style="text-decoration: underline;">Sign in</a> ·
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>

</html>
